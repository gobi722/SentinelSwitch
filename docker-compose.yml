services:

  # ---------------------------------------------------------------------------
  # Zookeeper — Kafka coordination
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: sentinel-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Kafka — single broker (local dev)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: sentinel-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9096:9096"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,PUBLIC://0.0.0.0:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092,PUBLIC://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,PUBLIC:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # ---------------------------------------------------------------------
      # PUBLIC listener (9096) — SASL/SCRAM-authenticated, for external
      # callers to consume their own results.<client_id> topic. INTERNAL and
      # EXTERNAL are untouched (still anonymous PLAINTEXT, as before).
      # See docs/MULTI_TENANT_RESULT_DELIVERY.md and scripts/provision-client.sh.
      # ---------------------------------------------------------------------
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_LISTENER_NAME_PUBLIC_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_LISTENER_NAME_PUBLIC_SCRAM-SHA-256_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required;"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      # Anonymous (INTERNAL/EXTERNAL) principal stays a super-user so every
      # existing consumer group keeps working exactly as before — 100% of
      # new ACL enforcement is confined to the PUBLIC listener's non-anonymous
      # (SASL-authenticated) principals.
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 12
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9093 > /dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 30s
  # ---------------------------------------------------------------------------
  # Confluent Schema Registry
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    hostname: schema-registry
    container_name: sentinel-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9093
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    hostname: redis
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy noeviction
      --appendonly no
      --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: sentinel-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sentinelswitch
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_local_secret
    volumes:
      - sentinel-postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelswitch"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.1
    hostname: prometheus
    container_name: sentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sentinel-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.2
    hostname: grafana
    container_name: sentinel-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: sentinel_grafana
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - sentinel-grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro

  # ---------------------------------------------------------------------------
  # Risk Service — gRPC scoring engine. No external deps (Fraud Engine is the
  # only caller), so it just needs to be up before Fraud Engine starts.
  # ---------------------------------------------------------------------------
  risk-service:
    build:
      context: .
      dockerfile: services/risk-service/Dockerfile
    hostname: risk-service
    container_name: sentinel-risk-service
    ports:
      - "50052:50052"
      - "9094:9094"
      - "8084:8084"
    environment:
      LOG_DIR: /logs/risk-service
      DEPLOY_ENV: docker-compose
    volumes:
      - ./logs/risk-service:/logs/risk-service

  # ---------------------------------------------------------------------------
  # API Gateway — entry point. Publishes to Kafka topic `transactions`.
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    hostname: api-gateway
    container_name: sentinel-api-gateway
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9093
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PAN_HASH_SECRET: ${PAN_HASH_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      RATE_LIMITING_RPS: ${RATE_LIMITING_RPS:-100}
      RATE_LIMITING_BURST: ${RATE_LIMITING_BURST:-200}
      REDIS_HOST: redis
      LOG_DIR: /logs/api-gateway
      DEPLOY_ENV: docker-compose
    ports:
      - "50051:50051"
      - "9091:9091"
      - "8086:8081"
    volumes:
      - ./logs/api-gateway:/logs/api-gateway

  # ---------------------------------------------------------------------------
  # Fraud Engine — consumes `transactions`, calls Risk Service, produces
  # `fraud_results`.
  # ---------------------------------------------------------------------------
  fraud-engine:
    build:
      context: .
      dockerfile: services/fraud-engine/Dockerfile
    hostname: fraud-engine
    container_name: sentinel-fraud-engine
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      redis:
        condition: service_healthy
      risk-service:
        condition: service_started
    environment:
      KAFKA_BROKERS: kafka:9093
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      RISK_SERVICE_HOST: risk-service
      REDIS_HOST: redis
      LOG_DIR: /logs/fraud-engine
      DEPLOY_ENV: docker-compose
    ports:
      - "9095:9095"
      - "8082:8082"
    volumes:
      - ./logs/fraud-engine:/logs/fraud-engine

  # ---------------------------------------------------------------------------
  # Persistence Service — consumes `fraud_results`, upserts into PostgreSQL.
  # ---------------------------------------------------------------------------
  persistence-svc:
    build:
      context: .
      dockerfile: services/persistence-svc/Dockerfile
    hostname: persistence-svc
    container_name: sentinel-persistence-svc
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9093
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_DIR: /logs/persistence-svc
      DEPLOY_ENV: docker-compose
    ports:
      - "9093:9093"
      - "8083:8083"
    volumes:
      - ./logs/persistence-svc:/logs/persistence-svc

  # ---------------------------------------------------------------------------
  # Result Notifier — consumes `fraud_results`, republishes to
  # `results.<client_id>` (or `results_unrouted_dlq`).
  # ---------------------------------------------------------------------------
  result-notifier:
    build:
      context: .
      dockerfile: services/result-notifier/Dockerfile
    hostname: result-notifier
    container_name: sentinel-result-notifier
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9093
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      LOG_DIR: /logs/result-notifier
      DEPLOY_ENV: docker-compose
    ports:
      - "9098:9098"
      - "8085:8085"
    volumes:
      - ./logs/result-notifier:/logs/result-notifier

# ---------------------------------------------------------------------------
# Named volumes — must be declared here
# ---------------------------------------------------------------------------
volumes:
  sentinel-postgres-data:
  sentinel-prometheus-data:
  sentinel-grafana-data: